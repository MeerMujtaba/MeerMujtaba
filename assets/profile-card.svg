<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Meer Mujtaba profile card</title>
  <desc id="desc">A glass-style developer profile card with portrait, statistics, skills, and activity map.</desc>
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset=".55" stop-color="#17212c"/>
      <stop offset="1" stop-color="#203a5b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset=".55" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#35516e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#17212c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatarClip"><circle cx="150" cy="125" r="80"/></clipPath>
    <pattern id="mapGrid" width="17" height="17" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="11" height="11" rx="3" fill="#17283a"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="998" height="468" rx="30" fill="url(#outer)" stroke="#29445f"/>
  <rect x="18" y="18" width="964" height="434" rx="25" fill="#151c24" fill-opacity=".92" stroke="#344454"/>
  <circle cx="890" cy="65" r="210" fill="url(#orb)"/>
  <circle cx="70" cy="470" r="190" fill="url(#orb)"/>

  <rect x="55" y="40" width="190" height="190" rx="34" fill="#1c2a39" stroke="#355775"/>
  <circle cx="150" cy="125" r="84" fill="#0f1720" stroke="#8cc8ff" stroke-width="4"/>
  <image xlink:href="avatar.png" x="30" y="18" width="230" height="213" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>

  <text x="275" y="86" fill="#f1f5f9" font-size="44" font-weight="900" font-family="Inter, Arial, sans-serif">MEER MUJTABA</text>
  <text x="275" y="122" fill="#3b82f6" font-size="22" font-weight="800" font-family="Inter, Arial, sans-serif">@meermujtaba</text>
  <text x="275" y="159" fill="#9ca3af" font-size="17" font-family="Inter, Arial, sans-serif">Meer Mujtaba Khan | CSE Student 💻 Building solutions one line at a time.</text>
  <rect x="275" y="187" width="300" height="7" rx="4" fill="#263c55"/>
  <rect x="275" y="187" width="130" height="7" rx="4" fill="url(#line)"/>

  <!-- Clear separation: stats end at x=530; activity panel starts at x=585. -->
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(55 250)">
      <rect width="145" height="100" rx="20" fill="#111820" stroke="#303a45"/>
      <text x="20" y="35" fill="#9ca3af" font-size="13" font-weight="800">STARS</text>
      <text x="20" y="76" fill="#f8fafc" font-size="34" font-weight="900">2</text>
    </g>
    <g transform="translate(215 250)">
      <rect width="145" height="100" rx="20" fill="#111820" stroke="#303a45"/>
      <text x="20" y="35" fill="#9ca3af" font-size="13" font-weight="800">CONTRIBUTIONS</text>
      <text x="20" y="76" fill="#f8fafc" font-size="34" font-weight="900">70</text>
    </g>
    <g transform="translate(375 250)">
      <rect width="145" height="100" rx="20" fill="#111820" stroke="#303a45"/>
      <text x="20" y="35" fill="#9ca3af" font-size="13" font-weight="800">ACTIVE DAYS</text>
      <text x="20" y="76" fill="#f8fafc" font-size="34" font-weight="900">13</text>
    </g>
  </g>

  <text x="605" y="238" fill="#f8fafc" font-size="18" font-weight="900" font-family="Inter, Arial, sans-serif">ACTIVITY MAP</text>
  <rect x="585" y="250" width="350" height="132" rx="20" fill="#10171f" stroke="#303a45"/>
  <rect x="608" y="269" width="288" height="92" fill="url(#mapGrid)"/>
  <g fill="#16a34a">
    <rect x="848" y="269" width="11" height="11" rx="3"/><rect x="814" y="286" width="11" height="11" rx="3"/>
    <rect x="814" y="303" width="11" height="11" rx="3"/><rect x="865" y="303" width="11" height="11" rx="3"/>
    <rect x="848" y="320" width="11" height="11" rx="3"/><rect x="780" y="337" width="11" height="11" rx="3"/>
    <rect x="729" y="337" width="11" height="11" rx="3"/><rect x="865" y="337" width="11" height="11" rx="3"/>
    <rect x="882" y="303" width="11" height="11" rx="3"/>
  </g>
  <g fill="#4ade80">
    <rect x="814" y="303" width="11" height="11" rx="3"/><rect x="848" y="354" width="11" height="11" rx="3"/>
    <rect x="865" y="354" width="11" height="11" rx="3"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">
    <g transform="translate(55 386)"><rect width="92" height="32" rx="16" fill="#2b2124" stroke="#a94331"/><circle cx="18" cy="16" r="5" fill="#f06529"/><text x="31" y="21" fill="#f1f5f9">HTML</text></g>
    <g transform="translate(157 386)"><rect width="82" height="32" rx="16" fill="#26213a" stroke="#55368e"/><circle cx="18" cy="16" r="5" fill="#8b5cf6"/><text x="31" y="21" fill="#f1f5f9">CSS</text></g>
    <g transform="translate(249 386)"><rect width="120" height="32" rx="16" fill="#373724" stroke="#827c2d"/><circle cx="18" cy="16" r="5" fill="#fde047"/><text x="31" y="21" fill="#f1f5f9">JavaScript</text></g>
    <g transform="translate(379 386)"><rect width="86" height="32" rx="16" fill="#32291e" stroke="#7c531b"/><circle cx="18" cy="16" r="5" fill="#d08717"/><text x="31" y="21" fill="#f1f5f9">Java</text></g>
  </g>
</svg>
