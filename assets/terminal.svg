<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="172" viewBox="0 0 1000 172" role="img" aria-labelledby="title desc">
  <title id="title">Meer Mujtaba terminal heading</title>
  <desc id="desc">A dark terminal window with a teal and white developer name heading.</desc>
  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="170" rx="10" fill="url(#terminalBg)" stroke="#1f2937"/>
  <rect x="1" y="1" width="998" height="30" rx="10" fill="#0c111b"/>
  <rect x="1" y="22" width="998" height="9" fill="#0c111b"/>
  <circle cx="22" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="5" fill="#febc2e"/>
  <circle cx="58" cy="16" r="5" fill="#28c840"/>
  <text x="500" y="19" text-anchor="middle" fill="#6b7280" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">meermujtaba@github:~$ ./profile --live</text>
  <text x="505" y="124" text-anchor="middle" fill="#2dd4bf" opacity=".34" font-size="68" font-weight="900" letter-spacing="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">MEER MUJTABA</text>
  <text x="495" y="120" text-anchor="middle" fill="#60a5fa" opacity=".24" font-size="68" font-weight="900" letter-spacing="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">MEER MUJTABA</text>
  <text x="500" y="122" text-anchor="middle" fill="#e6fffb" font-size="68" font-weight="900" letter-spacing="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" filter="url(#softGlow)">MEER MUJTABA</text>
</svg>

