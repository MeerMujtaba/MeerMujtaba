<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
  <title id="title">Meer Mujtaba profile scan</title>
  <desc id="desc">A terminal-style profile scan with portrait and developer information in separated panels.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#043f38"/><stop offset=".55" stop-color="#064e3b"/><stop offset="1" stop-color="#12365f"/>
    </linearGradient>
    <radialGradient id="photoGlow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/><stop offset="1" stop-color="#082b2a" stop-opacity="0"/></radialGradient>
    <clipPath id="portraitClip"><circle cx="229" cy="281" r="150"/></clipPath>
    <filter id="portraitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="528" rx="18" fill="url(#frame)" stroke="#2dd4bf"/>
  <rect x="1" y="1" width="998" height="37" rx="18" fill="#0c111b"/><rect x="1" y="25" width="998" height="13" fill="#0c111b"/>
  <circle cx="22" cy="19" r="5" fill="#ff5f57"/><circle cx="40" cy="19" r="5" fill="#febc2e"/><circle cx="58" cy="19" r="5" fill="#28c840"/>
  <text x="500" y="22" text-anchor="middle" fill="#5eead4" font-size="10" font-family="ui-monospace, Consolas, monospace">meermujtaba@github ~ $ ./profile-scan --live</text>
  <circle cx="924" cy="19" r="4" fill="#2dd4bf"/><text x="942" y="23" fill="#5eead4" font-size="10" font-weight="800" font-family="Inter, Arial, sans-serif">LIVE</text>

  <!-- A 22px gap keeps the portrait and information boxes from overlapping. -->
  <rect x="22" y="57" width="414" height="443" rx="14" fill="#082b2a" stroke="#2dd4bf"/>
  <rect x="458" y="57" width="520" height="443" rx="14" fill="#082b2a" stroke="#2dd4bf"/>
  <text x="42" y="82" fill="#5eead4" font-size="10" font-weight="800" letter-spacing="2" font-family="ui-monospace, Consolas, monospace">PROFILE.IMAGE</text>
  <text x="478" y="82" fill="#5eead4" font-size="10" font-weight="800" letter-spacing="2" font-family="ui-monospace, Consolas, monospace">SYSTEM.INFO</text>

  <circle cx="229" cy="281" r="178" fill="url(#photoGlow)"/>
  <circle cx="229" cy="281" r="156" fill="#071b1a" stroke="#5eead4" stroke-width="4" filter="url(#portraitGlow)"/>
  <image xlink:href="avatar.png" x="6" y="81" width="430" height="399" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
  <circle cx="229" cy="281" r="150" fill="none" stroke="#99f6e4" stroke-width="2"/>
  <text x="229" y="470" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="800" letter-spacing="2" font-family="ui-monospace, Consolas, monospace">MEER MUJTABA • LIVE PROFILE</text>

  <g font-family="ui-monospace, Consolas, monospace" font-size="13">
    <text x="478" y="112" fill="#5eead4">Subject</text><line x1="556" y1="108" x2="710" y2="108" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="112" fill="#ccfbf1" font-weight="700">MEER MUJTABA</text>
    <text x="478" y="151" fill="#5eead4">Handle</text><line x1="556" y1="147" x2="710" y2="147" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="151" fill="#ccfbf1">@meermujtaba</text>
    <text x="478" y="190" fill="#5eead4">Role</text><line x1="528" y1="186" x2="710" y2="186" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="190" fill="#ccfbf1">CSE Student · Builder</text>
    <text x="478" y="229" fill="#5eead4">Status</text><line x1="543" y1="225" x2="710" y2="225" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="229" fill="#ccfbf1">Building | Learning | Shipping</text>
    <text x="478" y="268" fill="#5eead4">Languages</text><line x1="571" y1="264" x2="710" y2="264" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="268" fill="#ccfbf1">HTML, CSS, JavaScript, Java</text>
    <text x="478" y="307" fill="#5eead4">Repositories</text><line x1="596" y1="303" x2="710" y2="303" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="307" fill="#ccfbf1">6</text>
    <text x="478" y="346" fill="#5eead4">Contributions</text><line x1="606" y1="342" x2="710" y2="342" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="346" fill="#ccfbf1">70</text>
    <text x="478" y="385" fill="#5eead4">Stars</text><line x1="533" y1="381" x2="710" y2="381" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="385" fill="#ccfbf1">2</text>
    <text x="478" y="424" fill="#5eead4">Followers</text><line x1="576" y1="420" x2="710" y2="420" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="424" fill="#ccfbf1">1</text>
    <text x="478" y="463" fill="#5eead4">Contact</text><line x1="556" y1="459" x2="710" y2="459" stroke="#1f5f5b" stroke-dasharray="2 5"/><text x="726" y="463" fill="#ccfbf1">github.com/meermujtaba</text>
  </g>
</svg>
